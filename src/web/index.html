<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>oni-vision</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #09090f;
    --bg-card: #11111e;
    --bg-elev: #1c1c30;
    --fg: #e2e2ee;
    --fg-dim: #7a7aa0;
    --fg-muted: #454560;
    --accent: #7f77dd;
    --hi: #facc15;
    --good: #4ade80;
    --warn: #facc15;
    --bad: #f87171;
    --border: #25254a;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f4fa;
      --bg-card: #ffffff;
      --bg-elev: #eaeaf4;
      --fg: #1a1a2e;
      --fg-dim: #534ab7;
      --fg-muted: #9090b8;
      --hi: #b06000;
      --border: #c8c8e8;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  body { padding: 16px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; margin: 18px 0 8px; color: var(--fg-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .mono { font-family: var(--mono); }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  header { padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .cycle { font-family: var(--mono); color: var(--fg-dim); }
  .status-line { font-size: 12px; color: var(--fg-dim); margin-top: 6px; display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.live { background: var(--good); }
  .dot.stale { background: var(--warn); }
  .dot.cold { background: var(--bad); }
  .source { font-family: var(--mono); color: var(--fg-muted); font-size: 11px; word-break: break-all; }
  .counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .count-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; text-align: center;
  }
  .count-card .n { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--hi); }
  .count-card .label { font-size: 11px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); }
  td { padding: 4px 6px; vertical-align: middle; }
  td.name { width: 22%; white-space: nowrap; }
  td.bar { width: 32%; padding-right: 12px; }
  td.pct { width: 10%; text-align: right; color: var(--fg-dim); }
  td.skills { color: var(--fg-dim); font-size: 12px; }
  td.metric { font-family: var(--mono); text-align: right; color: var(--fg-dim); }
  td.count { font-family: var(--mono); text-align: right; color: var(--fg-dim); }
  .bar-track {
    background: var(--bg-elev); height: 10px; border-radius: 3px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .bar-fill { height: 100%; background: var(--good); transition: width 0.3s; }
  .bar-fill.med { background: var(--warn); }
  .bar-fill.high { background: var(--bad); }
  .empty { color: var(--fg-muted); font-style: italic; }
  .err {
    background: var(--bg-card); border: 1px solid var(--bad); color: var(--bad);
    padding: 12px; border-radius: 6px;
  }
  .badge { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-left: 5px; vertical-align: middle; }
  .badge.bad  { background: rgba(248,113,113,0.15); color: var(--bad);  border: 1px solid rgba(248,113,113,0.3); }
  .badge.warn { background: rgba(250,204,21,0.15);  color: var(--warn); border: 1px solid rgba(250,204,21,0.3); }
  .three-up { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 600px) {
    .counts   { grid-template-columns: repeat(2, 1fr); }
    .three-up { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="row">
    <h1 id="base-name">…</h1>
    <span class="cycle" id="cycle">cycle —</span>
  </div>
  <div class="status-line">
    <span class="dot cold" id="liveness-dot"></span>
    <span id="liveness">connecting…</span>
    <span style="color: var(--fg-muted);">·</span>
    <span class="source" id="source-file"></span>
  </div>
</header>

<main id="main">
  <div id="err-banner" class="err" hidden></div>

  <div class="counts" id="counts"></div>

  <h2>Dupes</h2>
  <div class="card" id="dupes-card"><div class="empty">loading…</div></div>

  <div class="three-up">
    <div>
      <h2>Geysers</h2>
      <div class="card" id="geysers-card"><div class="empty">loading…</div></div>
    </div>
    <div>
      <h2>Food stores</h2>
      <div class="card" id="food-card"><div class="empty">loading…</div></div>
    </div>
    <div>
      <h2>Stockpile</h2>
      <div class="card" id="resources-card"><div class="empty">loading…</div></div>
    </div>
  </div>
</main>

<script>
  // ── Name lookup tables ───────────────────────────────────────────────────────
  // SimHash integers → human-readable names. Same data as src/elements.js and
  // the GEYSER_NAMES map in src/ui.js. Keys stored as strings because JS Maps
  // compare object keys by identity, not value — using a plain Object is safe
  // here since all keys are integers (no collision with inherited properties).

    "1306370440":  "Iron",

    "733064268":   "Platinum",
    "1838482828":  "Unobtanium",
    "-1208854194": "Wolframite",
    "-400237395":  "Oxidized Copper",
    // Carbon & glass
    "892111639":   "Coal",
    "-902240476":  "Refined Carbon",
    "-2079931820": "Diamond",
    "623986332":   "Glass",
    "-1467370314": "Ceramic",
    "-1139150657": "Mineral Wool",
    // Special / manufactured
    "-123825053":  "Super Coolant",
    "-1713958528": "Super Insulator",
    "1071649902":  "Katairite",
    // Elemental solids
    "-220394187":  "Phosphorus",
    "-729385479":  "Sulfur",
    // Ice / frozen
    "873952427":   "Ice",
    "-1561279013": "Brine Ice",
    "1664334585":  "Dirty Ice",
    "489261827":   "Snow",
  };

  const GEYSER_NAMES = {
    "-899515856":   "Steam Vent",
    "-2022709954":  "Hot Steam Vent",
    "713477285":    "Hot Water Geyser",
    "630638510":    "Salt Water Geyser",
    "1280790313":   "Slush Geyser",
    "1483840464":   "Chlorine Vent",
    "-1046145888":  "Hydrogen Vent",
    "-841236436":   "Natural Gas Geyser",
    "-597658376":   "Leaky Oil Fissure",
    "1482090435":   "CO₂ Geyser",
    "-1765654948":  "Liquid Sulfur Geyser",
    "-471575302":   "Minor Volcano",
    "-1592417549":  "Volcano",
    "-695301211":   "Copper Volcano",
    "-1332060084":  "Gold Volcano",
    "254095636":    "Iron Volcano",
    "159381264":    "Tungsten Volcano",
    "1137916511":   "Cobalt Volcano",
    "-968505972":   "Aluminum Volcano",
    "976669543":    "Niobium Volcano",
  };

  // Disease / negative status effects to surface as badges on dupe rows.
  // Only the effects in this map are shown; positive effects are ignored.
  const BAD_EFFECTS = {
    "FoodPoisoning":        { label: "Food Poisoned",  cls: "bad"  },
    "SlimeLung":            { label: "Slimelung",       cls: "bad"  },
    "ZombieSpores":         { label: "Zombie Spores",  cls: "bad"  },
    "Scalding":             { label: "Scalding",        cls: "bad"  },
    "SevereScalding":       { label: "Melting",         cls: "bad"  },
    "Hypothermia":          { label: "Hypothermia",     cls: "warn" },
    "SevereHypothermia":    { label: "Freezing",        cls: "bad"  },
    "Sunburn":              { label: "Sunburned",       cls: "warn" },
    "StressedOut":          { label: "Stressed Out",    cls: "warn" },
    "Suffocation":          { label: "Suffocating",     cls: "bad"  },
    "Suffocating":          { label: "Suffocating",     cls: "bad"  },
    "MinorAilment":         { label: "Ill",             cls: "warn" },
    "MajorAilment":         { label: "Sick",            cls: "bad"  },
    "Pathogen_FoodPoisoning":{ label: "Food Poisoned",  cls: "bad"  },
  };

  // Food prefab ID → { name, kcal per item }.
  // kcal values are the game's standard item calorie count.
  const FOOD = {
    "MushBar":          { name: "Mush Bar",         kcal: 1000 },
    "Mushroom":         { name: "Raw Mushroom",      kcal: 1   },
    "FriedMushroom":    { name: "Fried Mushroom",    kcal: 1600 },
    "MushFry":          { name: "Mush Fry",          kcal: 1200 },
    "CookedEgg":        { name: "Cooked Egg",        kcal: 2000 },
    "RawEgg":           { name: "Raw Egg",           kcal: 700  },
    "Burger":           { name: "Barbecue",          kcal: 4000 },
    "Meat":             { name: "Raw Meat",          kcal: 1600 },
    "CookedMeat":       { name: "Cooked Meat",       kcal: 2400 },
    "SpiceBread":       { name: "Spice Bread",       kcal: 2400 },
    "SurfAndTurf":      { name: "Surf 'n' Turf",     kcal: 6000 },
    "PepperbreadMeal":  { name: "Pepper Bread",      kcal: 3200 },
    "SpicyTofu":        { name: "Spicy Tofu",        kcal: 3200 },
    "MeatPlanks":       { name: "Jerky",             kcal: 4800 },
    "PlantMeat":        { name: "Plant Meat",        kcal: 1600 },
    "BasicForagePlant": { name: "Mealwood Shoot",    kcal: 600  },
    "Tofu":             { name: "Tofu",              kcal: 1600 },
    "WormBasicFood":    { name: "Stuffed Berry",     kcal: 4000 },
    "MushroomWrap":     { name: "Mushroom Wrap",     kcal: 4000 },
    "FruitCake":        { name: "Frost Burger",      kcal: 6000 },
    "ColdWheatBread":   { name: "Cold Wheat Bread",  kcal: 1600 },
    "PrickleFig":       { name: "Prickle Muffin",    kcal: 1200 },
    "Lettuce":          { name: "Lettuce",           kcal: 1   },
    "SpiceNut":         { name: "Spice Nut",         kcal: 1   },
    "BeanPlantSeed":    { name: "Nosh Bean",         kcal: 600  },
    "SwampLily":        { name: "Swamp Lily",        kcal: 1   },
  };

  // Skill branch prefix → display label (mirrors SKILL_LABELS in src/ui.js).
  const SKILL_LABELS = {
    mining:       "Miner",
    building:     "Builder",
    researching:  "Researcher",
    farming:      "Farmer",
    cooking:      "Cook",
    ranching:     "Rancher",
    arting:       "Artist",
    doctoring:    "Medic",
    hauling:      "Hauler",
    suit:         "Suit",
    power:        "Engineer",
    plumbing:     "Plumber",
    hvac:         "HVAC",
    rocketry:     "Rocketry",
    farming2:     "Botanist",
    spaceanalysis:"Space",
  };
  const ROMAN = ["", "I", "II", "III", "IV", "V"];

  /** Resolve a numeric element_id to a display name. */
  function elementName(id) {
    if (id == null) return "?";
    const key = String(Math.trunc(Number(id)));
    return ELEMENT_NAMES[key] ?? String(id);
  }

  /** Resolve a numeric geyser type_id to a display name. */
  function geyserName(id) {
    if (id == null) return "(unknown)";
    const key = String(Math.trunc(Number(id)));
    return GEYSER_NAMES[key] ?? `hash:${key}`;
  }

  /**
   * Convert a comma-separated skills string (GROUP_CONCAT output) into a
   * compact human-readable label, e.g. "Mining1,Mining2,Building1" → "Miner II, Builder I".
   * Groups by branch prefix, keeps highest level per branch.
   */
  function formatSkills(raw) {
    if (!raw) return "";
    const bestLevel = {};
    for (const skill of raw.split(",")) {
      const m = skill.match(/^([A-Za-z]+?)(\d+)?$/);
      if (!m) continue;
      const branch = m[1].toLowerCase();
      const level = m[2] ? Number(m[2]) : 1;
      if (!(branch in bestLevel) || level > bestLevel[branch]) {
        bestLevel[branch] = level;
      }
    }
    const parts = [];
    for (const [branch, level] of Object.entries(bestLevel)) {
      const label = SKILL_LABELS[branch] ?? (branch.charAt(0).toUpperCase() + branch.slice(1));
      const roman = ROMAN[level] ?? String(level);
      parts.push(roman ? `${label} ${roman}` : label);
    }
    return parts.join(", ");
  }

  // ── DOM helpers ──────────────────────────────────────────────────────────────

  const POLL_MS = 10000;        // polling fallback (SSE is the primary push path)
  const STALE_AFTER_S = 600;   // 10 minutes — UI flips dot to "stale"

  function $(id) { return document.getElementById(id); }
  function setText(id, t) { const el = $(id); if (el) el.textContent = t; }
  function setHTML(id, h)  { const el = $(id); if (el) el.innerHTML = h; }

  function fmtAge(seconds) {
    if (seconds == null) return "unknown";
    const s = Math.max(0, Math.floor(seconds));
    if (s < 90)    return `${s}s ago`;
    if (s < 5400)  return `${Math.floor(s/60)}m ago`;
    if (s < 86400) return `${Math.floor(s/3600)}h ago`;
    return `${Math.floor(s/86400)}d ago`;
  }

  function fmtKcal(kcal) {
    if (kcal == null || !Number.isFinite(Number(kcal))) return "?";
    const k = Number(kcal);
    if (k >= 1_000_000) return `${(k / 1_000_000).toFixed(1)} Mkcal`;
    if (k >= 1_000)     return `${(k / 1_000).toFixed(0)} kkcal`;
    return `${k.toFixed(0)} kcal`;
  }

  function fmtMass(units) {
    if (units == null) return "?";
    const u = Number(units);
    if (!Number.isFinite(u)) return "?";
    if (u >= 1_000_000) return `${(u/1_000_000).toFixed(2)} kt`;
    if (u >= 1_000)     return `${(u/1_000).toFixed(2)} t`;
    return `${u.toFixed(0)} kg`;
  }

  function bar(pct) {
    const v = Math.max(0, Math.min(100, Number(pct) || 0));
    const cls = v >= 60 ? "high" : v >= 30 ? "med" : "";
    return `<div class="bar-track"><div class="bar-fill ${cls}" style="width: ${v}%"></div></div>`;
  }

  function fileBaseName(path) {
    if (!path) return "";
    return String(path).split(/[\\/]/).pop();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // ── Renderers ────────────────────────────────────────────────────────────────

  function renderCounts(c) {
    const items = [
      ["duplicants", c.duplicants],
      ["critters",   c.critters],
      ["geysers",    c.geysers],
      ["buildings",  c.buildings],
    ];
    setHTML("counts", items.map(([label, n]) =>
      `<div class="count-card"><div class="n">${n ?? "—"}</div><div class="label">${label}</div></div>`
    ).join(""));
  }

  function renderDupes(rows) {
    if (!rows || rows.length === 0) {
      setHTML("dupes-card", `<div class="empty">no duplicants in this save</div>`);
      return;
    }
    const html = rows.map(r => {
      const pct = r.stress == null ? "—" : `${Number(r.stress).toFixed(1)}%`;
      const barCell = r.stress == null
        ? `<div class="bar-track"><div class="bar-fill" style="width:0%;background:var(--bg-elev)"></div></div>`
        : bar(r.stress);
      const skillsLabel = formatSkills(r.skills);
      const badges = (r.effects ?? [])
        .map(e => BAD_EFFECTS[e])
        .filter(Boolean)
        .map(e => `<span class="badge ${e.cls}">${escapeHtml(e.label)}</span>`)
        .join("");
      return `<tr>
        <td class="name">${escapeHtml(r.name ?? "(unnamed)")}${badges}</td>
        <td class="bar">${barCell}</td>
        <td class="pct">${pct}</td>
        <td class="skills">${escapeHtml(skillsLabel)}</td>
      </tr>`;
    }).join("");
    setHTML("dupes-card", `<table><tbody>${html}</tbody></table>`);
  }

  function renderGeysers(rows) {
    if (!rows || rows.length === 0) {
      setHTML("geysers-card", `<div class="empty">no geysers detected</div>`);
      return;
    }
    const html = rows.map(r => {
      const quality = Math.round(((Number(r.rate_roll) + Number(r.year_percent_roll)) / 2) * 100);
      const cls = quality >= 70 ? "" : quality >= 40 ? "med" : "high"; // reuse stress bar colours inverted
      return `<tr>
        <td style="font-size:12px">${escapeHtml(geyserName(r.type_id))}</td>
        <td class="bar" style="width:50%">
          <div class="bar-track">
            <div class="bar-fill ${cls}" style="width:${quality}%"></div>
          </div>
        </td>
        <td class="pct">${quality}%</td>
      </tr>`;
    }).join("");
    setHTML("geysers-card", `<table><tbody>${html}</tbody></table>`);
  }

  function renderFood(rows, dupeCount) {
    const known = (rows ?? [])
      .map(r => ({ info: FOOD[r.item_prefab_id], qty: r.qty }))
      .filter(r => r.info && r.info.kcal > 10)  // skip raw plants with kcal≈1
      .sort((a, b) => (b.qty * b.info.kcal) - (a.qty * a.info.kcal));

    if (known.length === 0) {
      setHTML("food-card", `<div class="empty">no food in storage</div>`);
      return;
    }
    const totalKcal = known.reduce((s, r) => s + r.qty * r.info.kcal, 0);
    const cycles = dupeCount > 0 ? Math.floor(totalKcal / (1000 * dupeCount)) : "?";

    const html = known.map(r => {
      const rowKcal = r.qty * r.info.kcal;
      return `<tr>
        <td style="font-size:12px">${escapeHtml(r.info.name)}</td>
        <td class="count">×${r.qty}</td>
        <td class="metric">${fmtKcal(rowKcal)}</td>
      </tr>`;
    }).join("");
    const footer = `<tr style="border-top:1px solid var(--border);margin-top:4px">
      <td colspan="2" style="color:var(--fg-dim);font-size:11px;padding-top:6px">~${cycles} cycles</td>
      <td class="metric" style="padding-top:6px">${fmtKcal(totalKcal)}</td>
    </tr>`;
    setHTML("food-card", `<table><tbody>${html}${footer}</tbody></table>`);
  }

  function renderResources(rows) {
    if (!rows || rows.length === 0) {
      setHTML("resources-card", `<div class="empty">stockpile empty</div>`);
      return;
    }
    const html = rows.map(r =>
      `<tr>
        <td style="font-size:12px">${escapeHtml(elementName(r.element_id))}</td>
        <td class="metric">${fmtMass(r.total_units)}</td>
      </tr>`
    ).join("");
    setHTML("resources-card", `<table><tbody>${html}</tbody></table>`);
  }

  // ── Liveness ─────────────────────────────────────────────────────────────────

  function setLiveness(state, label) {
    $("liveness-dot").className = "dot " + state;
    setText("liveness", label);
  }

  function showError(msg) {
    const el = $("err-banner");
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
    setLiveness("cold", "no data");
  }

  function clearError() {
    const el = $("err-banner");
    if (el) el.hidden = true;
  }

  // ── Fetch & render ───────────────────────────────────────────────────────────

  async function refresh() {
    try {
      const res = await fetch("/api/status", { cache: "no-store" });
      if (res.status === 503) {
        const body = await res.json();
        showError(body.message || body.error || "oni-vision hasn't produced data yet");
        return;
      }
      if (!res.ok) { showError(`HTTP ${res.status}`); return; }
      const data = await res.json();
      clearError();

      setText("base-name", data.base_name || "(unnamed colony)");
      setText("cycle", data.cycle != null ? `cycle ${data.cycle}` : "(unknown cycle)");
      setText("source-file", fileBaseName(data.source_file));

      const age = data.age_seconds;
      if (age == null) {
        setLiveness("cold", "no parse yet");
      } else if (age >= STALE_AFTER_S) {
        setLiveness("stale", `parsed ${fmtAge(age)} (stale)`);
      } else {
        setLiveness("live", `parsed ${fmtAge(age)}`);
      }

      renderCounts(data.counts || {});
      renderDupes(data.top_dupes || []);
      renderGeysers(data.geyser_types || []);
      renderFood(data.food || [], data.counts?.duplicants ?? 0);
      renderResources(data.top_resources || []);
    } catch (err) {
      showError(`fetch failed: ${err.message}`);
    }
  }

  // ── SSE — instant push when a new save lands ─────────────────────────────────

  function connectSSE() {
    const es = new EventSource("/api/events");
    es.addEventListener("parse", () => refresh());
    es.onerror = () => {
      // EventSource auto-reconnects; nothing extra needed.
    };
  }

  // ── Boot ─────────────────────────────────────────────────────────────────────

  refresh();
  connectSSE();
  // Polling as a safety net: covers cases where the SSE connection drops and
  // the browser is slow to reconnect, or a save lands during the reconnect window.
  setInterval(refresh, POLL_MS);
</script>

</body>
</html>
