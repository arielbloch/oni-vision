<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>oni-vision</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #09090f;
    --bg-card: #11111e;
    --bg-elev: #1c1c30;
    --fg: #e2e2ee;
    --fg-dim: #7a7aa0;
    --fg-muted: #454560;
    --accent: #7f77dd;
    --hi: #facc15;
    --good: #4ade80;
    --warn: #facc15;
    --bad: #f87171;
    --border: #25254a;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f4fa;
      --bg-card: #ffffff;
      --bg-elev: #eaeaf4;
      --fg: #1a1a2e;
      --fg-dim: #534ab7;
      --fg-muted: #9090b8;
      --hi: #b06000;
      --border: #c8c8e8;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  body { padding: 16px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; margin: 18px 0 8px; color: var(--fg-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .mono { font-family: var(--mono); }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  header { padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .cycle { font-family: var(--mono); color: var(--fg-dim); }
  .status-line { font-size: 12px; color: var(--fg-dim); margin-top: 6px; display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.live { background: var(--good); }
  .dot.stale { background: var(--warn); }
  .dot.cold { background: var(--bad); }
  .source { font-family: var(--mono); color: var(--fg-muted); font-size: 11px; word-break: break-all; }
  .counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .count-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; text-align: center;
  }
  .count-card .n { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--hi); }
  .count-card .label { font-size: 11px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); }
  td { padding: 4px 6px; vertical-align: middle; }
  td.name { width: 20%; white-space: nowrap; }
  td.bar { width: 22%; padding-right: 12px; }
  td.pct { width: 7%; text-align: right; color: var(--fg-dim); }
  td.skills { color: var(--fg-dim); font-size: 12px; width: 20%; }
  td.focus { font-size: 11px; width: 31%; }
  .sp-badge {
    display: inline-block; padding: 1px 5px; border-radius: 3px;
    font-size: 11px; font-weight: 600; margin-right: 4px;
    background: rgba(255,255,255,0.04); color: var(--fg-dim);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .sp-badge.has-sp {
    background: rgba(250,204,21,0.18); color: var(--hi);
    border-color: rgba(250,204,21,0.4);
  }
  /* p5 = highest (Attacking/Toggling): yellow like the header hi-color */
  .focus-tag {
    display: inline-block; padding: 1px 5px; border-radius: 3px; margin: 1px 2px 1px 0;
    background: rgba(251,146,60,0.15); color: #fb923c;
    border: 1px solid rgba(251,146,60,0.35);
  }
  .focus-tag.p5 {
    background: rgba(250,204,21,0.15); color: var(--hi);
    border-color: rgba(250,204,21,0.4);
  }
  td.metric { font-family: var(--mono); text-align: right; color: var(--fg-dim); }
  td.count { font-family: var(--mono); text-align: right; color: var(--fg-dim); }
  .bar-track {
    background: var(--bg-elev); height: 10px; border-radius: 3px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .bar-fill { height: 100%; background: var(--good); transition: width 0.3s; }
  .bar-fill.med { background: var(--warn); }
  .bar-fill.high { background: var(--bad); }
  .empty { color: var(--fg-muted); font-style: italic; }
  .err {
    background: var(--bg-card); border: 1px solid var(--bad); color: var(--bad);
    padding: 12px; border-radius: 6px;
  }
  .badge { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-left: 5px; vertical-align: middle; }
  .badge.bad  { background: rgba(248,113,113,0.15); color: var(--bad);  border: 1px solid rgba(248,113,113,0.3); }
  .badge.warn { background: rgba(250,204,21,0.15);  color: var(--warn); border: 1px solid rgba(250,204,21,0.3); }
  .three-up { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 600px) {
    .counts   { grid-template-columns: repeat(2, 1fr); }
    .three-up { grid-template-columns: 1fr; }
  }
  :root { --logo: #fb923c; }
  @media (prefers-color-scheme: light) { :root { --logo: #854F0B; } }
  .app-header {
    display: flex; align-items: center; gap: 9px;
    padding-bottom: 10px; margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .app-name {
    font-size: 17px; font-weight: 800; letter-spacing: 0.01em;
    color: var(--logo);
  }
</style>
</head>
<body>

<div class="app-header">
  <!-- Logo: hexagon lattice (colony grid) + central node (the colony) -->
  <svg viewBox="0 0 24 24" width="28" height="28" fill="none" aria-hidden="true">
    <polygon points="12,2 22,7 22,17 12,22 2,17 2,7" stroke="var(--logo)" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="3" fill="var(--logo)"/>
    <line x1="12" y1="2"    x2="12"  y2="9"    stroke="var(--logo)" stroke-width="1"/>
    <line x1="12" y1="15"   x2="12"  y2="22"   stroke="var(--logo)" stroke-width="1"/>
    <line x1="2"  y1="7"    x2="8.2" y2="10.5" stroke="var(--logo)" stroke-width="1"/>
    <line x1="15.8" y1="13.5" x2="22" y2="17"  stroke="var(--logo)" stroke-width="1"/>
    <line x1="2"  y1="17"   x2="8.2" y2="13.5" stroke="var(--logo)" stroke-width="1"/>
    <line x1="15.8" y1="10.5" x2="22" y2="7"   stroke="var(--logo)" stroke-width="1"/>
  </svg>
  <span class="app-name">ONI-vision</span>
</div>

<header>
  <div class="row">
    <h1 id="base-name">…</h1>
    <span class="cycle" id="cycle">cycle —</span>
  </div>
  <div class="status-line">
    <span class="dot cold" id="liveness-dot"></span>
    <span id="liveness">connecting…</span>
    <span style="color: var(--fg-muted);">·</span>
    <span class="source" id="source-file"></span>
  </div>
</header>

<main id="main">
  <div id="err-banner" class="err" hidden></div>

  <div class="counts" id="counts"></div>

  <h2>Dupes</h2>
  <div class="card" id="dupes-card"><div class="empty">loading…</div></div>

  <div class="three-up">
    <div>
      <h2>Geysers</h2>
      <div class="card" id="geysers-card"><div class="empty">loading…</div></div>
    </div>
    <div>
      <h2>Food</h2>
      <div class="card" id="food-card"><div class="empty">loading…</div></div>
    </div>
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px">
        <h2 style="margin:0">Stockpile</h2>
        <button id="stockpile-cfg-btn" onclick="togglePicker()" style="font-size:11px;padding:2px 8px;cursor:pointer;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--fg-dim)">configure</button>
      </div>
      <div id="stockpile-picker" style="display:none;background:var(--bg-elev);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;font-size:12px;max-height:180px;overflow-y:auto"></div>
      <div class="card" id="resources-card"><div class="empty">loading…</div></div>
    </div>
  </div>
</main>

<script>
  // ── Name lookup tables ───────────────────────────────────────────────────────
  // Populated from the API (/api/status) on each refresh. The server queries
  // current.sqlite which is the single source of truth, written from the JS
  // source files (src/elements.js, src/food.js, etc.) during each parse.
  // Starting empty is fine — they're filled before the first render call.

  let ELEMENT_NAMES    = {};  // element_id (string) → name
  let GEYSER_NAMES     = {};  // type_id (string)    → name
  let BAD_EFFECTS      = {};  // effect string        → { label, cls }
  let FOOD             = {};  // prefab_id            → { name, kcal, morale }
  let SKILL_LABELS     = {};  // branch               → label
  const ROMAN = ["", "I", "II", "III", "IV", "V"];

  /** Resolve a numeric element_id to a display name. */
  function elementName(id) {
    if (id == null) return "?";
    const key = String(Math.trunc(Number(id)));
    return ELEMENT_NAMES[key] ?? String(id);
  }

  /** Resolve a numeric geyser type_id to a display name. */
  function geyserName(id) {
    if (id == null) return "(unknown)";
    const key = String(Math.trunc(Number(id)));
    return GEYSER_NAMES[key] ?? `hash:${key}`;
  }

  /**
   * Sum the morale cost of a comma-separated mastered-skills string.
   * Each skill's tier number (e.g. Mining2 → 2, Hauling1 → 1) contributes
   * directly to the morale cost shown in-game.
   * Morale available is runtime-computed and not stored in the save.
   */
  function moraleCostOf(raw) {
    if (!raw) return 0;
    let cost = 0;
    for (const skill of raw.split(",")) {
      const m = skill.match(/\d+$/);
      cost += m ? Number(m[0]) : 1;
    }
    return cost;
  }

  // ── DOM helpers ──────────────────────────────────────────────────────────────

  const POLL_MS = 10000;        // polling fallback (SSE is the primary push path)
  const STALE_AFTER_S = 600;   // 10 minutes — UI flips dot to "stale"

  function $(id) { return document.getElementById(id); }
  function setText(id, t) { const el = $(id); if (el) el.textContent = t; }
  function setHTML(id, h)  { const el = $(id); if (el) el.innerHTML = h; }

  function fmtAge(seconds) {
    if (seconds == null) return "unknown";
    const s = Math.max(0, Math.floor(seconds));
    if (s < 90)    return `${s}s ago`;
    if (s < 5400)  return `${Math.floor(s/60)}m ago`;
    if (s < 86400) return `${Math.floor(s/3600)}h ago`;
    return `${Math.floor(s/86400)}d ago`;
  }

  function fmtKcal(kcal) {
    if (kcal == null || !Number.isFinite(Number(kcal))) return "?";
    const k = Number(kcal);
    if (k >= 1_000_000) return `${(k / 1_000_000).toFixed(1)} Mkcal`;
    if (k >= 1_000)     return `${(k / 1_000).toFixed(0)} kkcal`;
    return `${k.toFixed(0)} kcal`;
  }

  function fmtMass(units) {
    if (units == null) return "?";
    const u = Number(units);
    if (!Number.isFinite(u)) return "?";
    if (u >= 1_000_000) return `${(u/1_000_000).toFixed(2)} kt`;
    if (u >= 1_000)     return `${(u/1_000).toFixed(2)} t`;
    return `${u.toFixed(0)} kg`;
  }

  function bar(pct) {
    const v = Math.max(0, Math.min(100, Number(pct) || 0));
    const cls = v >= 60 ? "high" : v >= 30 ? "med" : "";
    return `<div class="bar-track"><div class="bar-fill ${cls}" style="width: ${v}%"></div></div>`;
  }

  function fileBaseName(path) {
    if (!path) return "";
    return String(path).split(/[\\/]/).pop();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"'\/]/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "/": "&#x2F;",
    }[c]));
  }

  // ── Renderers ────────────────────────────────────────────────────────────────

  function renderCounts(c) {
    const items = [
      ["duplicants", c.duplicants],
      ["critters",   c.critters],
      ["geysers",    c.geysers],
      ["buildings",  c.buildings],
    ];
    setHTML("counts", items.map(([label, n]) =>
      `<div class="count-card"><div class="n">${n ?? "—"}</div><div class="label">${label}</div></div>`
    ).join(""));
  }

  function renderDupes(rows) {
    if (!rows || rows.length === 0) {
      setHTML("dupes-card", `<div class="empty">no duplicants in this save</div>`);
      return;
    }
    const html = rows.map(r => {
      const pct = r.stress == null ? "—" : `${Number(r.stress).toFixed(1)}%`;
      const barCell = r.stress == null
        ? `<div class="bar-track"><div class="bar-fill" style="width:0%;background:var(--bg-elev)"></div></div>`
        : bar(r.stress);
      const cost = moraleCostOf(r.skills);
      const sp   = r.skill_points ?? 0;
      const spBadge = `<span class="sp-badge${sp > 0 ? " has-sp" : ""}">${sp} SP</span>`;
      // Skills cell: SP badge + morale cost (skill names removed per design)
      const skillsCell = `${spBadge}<span style="color:var(--fg-dim)">${cost} morale</span>`;
      const badges = (r.effects ?? [])
        .map(e => BAD_EFFECTS[e])
        .filter(Boolean)
        .map(e => `<span class="badge ${e.cls}">${escapeHtml(e.label)}</span>`)
        .join("");
      const focusTags = (r.focus ?? [])
        .map(f => {
          const cls = f.priority >= 5 ? "focus-tag p5" : "focus-tag";
          return `<span class="${cls}">${escapeHtml(f.label)}</span>`;
        })
        .join("");
      // Column order: name | focus (roles) | skills+morale | stress
      return `<tr>
        <td class="name">${escapeHtml(r.name ?? "(unnamed)")}${badges}</td>
        <td class="focus">${focusTags || '<span style="color:var(--fg-muted)">—</span>'}</td>
        <td class="skills">${skillsCell}</td>
        <td class="bar">${barCell}</td>
        <td class="pct">${pct}</td>
      </tr>`;
    }).join("");
    setHTML("dupes-card", `<table><tbody>${html}</tbody></table>`);
  }

  function renderGeysers(rows) {
    if (!rows || rows.length === 0) {
      setHTML("geysers-card", `<div class="empty">no geysers detected</div>`);
      return;
    }
    const html = rows.map(r => {
      const quality = Math.round(((Number(r.rate_roll) + Number(r.year_percent_roll)) / 2) * 100);
      const cls = quality >= 70 ? "" : quality >= 40 ? "med" : "high"; // reuse stress bar colours inverted
      return `<tr>
        <td style="font-size:12px">${escapeHtml(geyserName(r.type_id))}</td>
        <td class="bar" style="width:50%">
          <div class="bar-track">
            <div class="bar-fill ${cls}" style="width:${quality}%"></div>
          </div>
        </td>
        <td class="pct">${quality}%</td>
      </tr>`;
    }).join("");
    setHTML("geysers-card", `<table><tbody>${html}</tbody></table>`);
  }

  // ── Stockpile picker state ────────────────────────────────────────────────────

  // Persist selected element IDs across reloads in localStorage.
  // null means "show top 8 by mass" (default before user configures anything).
  const LS_KEY = "oni-stockpile-v1";
  let stockpileSelection = null; // Set<string> | null
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) stockpileSelection = new Set(JSON.parse(raw));
  } catch { /**/ }

  let allElements = [];   // populated from latest API response
  let inGameFilters = null; // Set<string> | null — from TreeFilterable in the save

  function togglePicker() {
    const el = $("stockpile-picker");
    if (!el) return;
    el.style.display = el.style.display === "none" ? "block" : "none";
    if (el.style.display === "block") renderPicker();
  }

  function renderPicker() {
    const el = $("stockpile-picker");
    if (!el || allElements.length === 0) return;
    el.innerHTML = allElements.map(r => {
      const id = String(Math.trunc(Number(r.element_id)));
      const checked = stockpileSelection === null || stockpileSelection.has(id) ? "checked" : "";
      const name = escapeHtml(elementName(r.element_id));
      const mass = escapeHtml(fmtMass(r.total_units));
      return `<label style="display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer">
        <input type="checkbox" data-id="${escapeHtml(id)}" ${checked} onchange="onPickerChange()">
        <span style="flex:1">${name}</span>
        <span style="color:var(--fg-muted)">${mass}</span>
      </label>`;
    }).join("");
  }

  function onPickerChange() {
    const checkboxes = ($("stockpile-picker") ?? {}).querySelectorAll?.("input[type=checkbox]") ?? [];
    if ([...checkboxes].every(cb => cb.checked)) {
      // All checked → treat as "no filter" (same as default)
      stockpileSelection = null;
      localStorage.removeItem(LS_KEY);
    } else {
      stockpileSelection = new Set([...checkboxes].filter(cb => cb.checked).map(cb => cb.dataset.id));
      try { localStorage.setItem(LS_KEY, JSON.stringify([...stockpileSelection])); } catch { /**/ }
    }
    renderResources(allElements);
  }

  // ── Renderers ─────────────────────────────────────────────────────────────────

  function renderFood(rows) {
    const known = (rows ?? [])
      .map(r => ({ info: FOOD[r.item_prefab_id], qty: r.qty }))
      .filter(r => r.info)
      .sort((a, b) => (b.qty * b.info.kcal) - (a.qty * a.info.kcal));

    if (known.length === 0) {
      setHTML("food-card", `<div class="empty">no food in storage</div>`);
      return;
    }

    const html = known.map(r => {
      const totalKcal = r.qty * r.info.kcal;
      const m = r.info.morale;
      const mLabel = m > 0 ? `+${m}` : String(m);
      const mColor = m > 0 ? "var(--good)" : m < 0 ? "var(--bad)" : "var(--fg-muted)";
      return `<tr>
        <td style="font-size:12px">${escapeHtml(r.info.name)}</td>
        <td class="metric">${fmtKcal(totalKcal)}</td>
        <td class="metric" style="color:${mColor};width:28px">${mLabel}</td>
      </tr>`;
    }).join("");
    setHTML("food-card", `<table><tbody>${html}</tbody></table>`);
  }

  function renderResources(rows) {
    allElements = rows ?? [];

    // Priority: user-configured selection > in-game filter > top 8 by mass.
    let display;
    if (stockpileSelection !== null && stockpileSelection.size > 0) {
      // User has manually chosen specific elements via the picker.
      display = allElements.filter(r => {
        const id = String(Math.trunc(Number(r.element_id)));
        return stockpileSelection.has(id);
      });
    } else if (inGameFilters !== null && inGameFilters.size > 0) {
      // Default: mirror the in-game storage filter settings from the save.
      display = allElements.filter(r => {
        const id = String(Math.trunc(Number(r.element_id)));
        return inGameFilters.has(id);
      });
    } else {
      // Last resort: top 8 elements by total mass.
      display = allElements.slice(0, 8);
    }

    if (display.length === 0) {
      setHTML("resources-card", `<div class="empty">stockpile empty</div>`);
      return;
    }
    const html = display.map(r =>
      `<tr>
        <td style="font-size:12px">${escapeHtml(elementName(r.element_id))}</td>
        <td class="metric">${fmtMass(r.total_units)}</td>
      </tr>`
    ).join("");
    setHTML("resources-card", `<table><tbody>${html}</tbody></table>`);
  }

  // ── Liveness ─────────────────────────────────────────────────────────────────

  function setLiveness(state, label) {
    $("liveness-dot").className = "dot " + state;
    setText("liveness", label);
  }

  function showError(msg) {
    const el = $("err-banner");
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
    setLiveness("cold", "no data");
  }

  function clearError() {
    const el = $("err-banner");
    if (el) el.hidden = true;
  }

  // ── Fetch & render ───────────────────────────────────────────────────────────

  async function refresh() {
    try {
      const res = await fetch("/api/status", { cache: "no-store" });
      if (res.status === 503) {
        const body = await res.json();
        showError(body.message || body.error || "oni-vision hasn't produced data yet");
        return;
      }
      if (!res.ok) { showError(`HTTP ${res.status}`); return; }
      const data = await res.json();
      clearError();

      setText("base-name", data.base_name || "(unnamed colony)");
      setText("cycle", data.cycle != null ? `cycle ${data.cycle}` : "(unknown cycle)");
      setText("source-file", fileBaseName(data.source_file));

      const age = data.age_seconds;
      if (age == null) {
        setLiveness("cold", "no parse yet");
      } else if (age >= STALE_AFTER_S) {
        setLiveness("stale", `parsed ${fmtAge(age)} (stale)`);
      } else {
        setLiveness("live", `parsed ${fmtAge(age)}`);
      }

      // Populate lookup tables from the DB-backed API response.
      if (data.element_names)     ELEMENT_NAMES = data.element_names;
      if (data.geyser_type_names) GEYSER_NAMES  = data.geyser_type_names;
      if (data.food_meta)         FOOD          = data.food_meta;
      if (data.effect_labels)     BAD_EFFECTS   = data.effect_labels;
      if (data.skill_labels)      SKILL_LABELS  = data.skill_labels;

      renderCounts(data.counts || {});
      renderDupes(data.top_dupes || []);
      renderGeysers(data.geyser_types || []);
      renderFood(data.food || []);

      // Update in-game filter defaults before rendering resources.
      if (data.stockpile_filters && data.stockpile_filters.length > 0) {
        inGameFilters = new Set(
          data.stockpile_filters.map(h => String(Math.trunc(Number(h))))
        );
      }
      renderResources(data.all_resources || []);
    } catch (err) {
      showError(`fetch failed: ${err.message}`);
    }
  }

  // ── SSE — instant push when a new save lands ─────────────────────────────────

  function connectSSE() {
    const es = new EventSource("/api/events");
    es.addEventListener("parse", () => refresh());
    es.onerror = () => {
      // EventSource auto-reconnects; nothing extra needed.
    };
  }

  // ── Boot ─────────────────────────────────────────────────────────────────────

  refresh();
  connectSSE();
  // Polling as a safety net: covers cases where the SSE connection drops and
  // the browser is slow to reconnect, or a save lands during the reconnect window.
  setInterval(refresh, POLL_MS);
</script>

</body>
