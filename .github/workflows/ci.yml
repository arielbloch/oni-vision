name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check sources
        run: |
          set -e
          for f in src/*.js src/cli/*.js \
                   oni-vision-plugin/lib/*.js \
                   oni-vision-plugin/mcp/*.js; do
            node --check "$f"
          done

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
